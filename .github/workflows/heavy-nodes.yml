name: Heavy Nodes

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      run_real_checks:
        description: "Run checkpoint-backed node checks on a self-hosted runner"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Heavy-node metadata and dry-run plans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Agent and environment dry-runs
        run: |
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval agent plan tts --language zh --metrics tts_cer,dnsmos --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval agent plan tse --language zh --metrics si_sdr,sim/wavlm-large,dnsmos --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval agent plan asr --language es --metric wer --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env setup --node normalization/funasr_itn --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval agent plan asr --language ar --metric cer --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env setup --node normalization/nemo_norm --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env setup --task tts --language zh --metrics tts_cer,dnsmos --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env setup --task tse --language zh --metrics si_sdr,sim/wavlm-large,dnsmos --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env download --node transcription/qwen3_asr_1_7b --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env download --node transcription/whisper_large_v3 --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env download --node scoring/dnsmos --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env download --node scoring/wv_mos --dry-run --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical sure-eval env download --node scoring/utmos --dry-run --json

  real-node-checks:
    name: Check prepared heavy nodes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_real_checks == 'true' }}
    runs-on:
      - self-hosted
      - sure-eval-heavy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate prepared node-local environments
        run: |
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node transcription/qwen3_asr_1_7b --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node transcription/whisper_large_v3 --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node transcription/paraformer_zh --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node normalization/funasr_itn --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node normalization/nemo_norm --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node scoring/dnsmos --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node scoring/wv_mos --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node scoring/utmos --json
          uv run --python 3.11 --extra dev --extra audio --extra canonical --extra diarization sure-eval env check --node scoring/wavlm_large_sim --json
      - name: Check checkpoint-backed environment tests
        run: |
          uv run \
            --python 3.11 \
            --extra dev \
            --extra audio \
            --extra canonical \
            --extra diarization \
            pytest tests/test_evaluation_env_check.py -q
          uv run \
            --python 3.11 \
            --extra dev \
            --extra audio \
            --extra canonical \
            --extra diarization \
            pytest tests/test_funasr_normalization_node.py -q
          uv run \
            --python 3.11 \
            --extra dev \
            --extra audio \
            --extra canonical \
            --extra diarization \
            pytest tests/test_arabic_nemo_asr_pipeline.py -q
