id: task/vad
version: v1
task: VAD
default_metric: f1
language_sensitive: false
routes:
  f1:
    pipeline_id: vad.any.f1.vad_contract_v1.vad_timebase_strict_v1.vad_detection_duration_v1
    validation: validation/vad_contract
    normalization: normalization/vad_timebase
    scoring: scoring/vad_detection_duration
  p_fa:
    pipeline_id: vad.any.p_fa.vad_contract_v1.vad_timebase_strict_v1.vad_detection_duration_v1
    validation: validation/vad_contract
    normalization: normalization/vad_timebase
    scoring: scoring/vad_detection_duration
  p_miss:
    pipeline_id: vad.any.p_miss.vad_contract_v1.vad_timebase_strict_v1.vad_detection_duration_v1
    validation: validation/vad_contract
    normalization: normalization/vad_timebase
    scoring: scoring/vad_detection_duration
  dcf_nist:
    pipeline_id: vad.any.dcf_nist.vad_contract_v1.vad_timebase_strict_v1.vad_detection_duration_v1
    validation: validation/vad_contract
    normalization: normalization/vad_timebase
    scoring: scoring/vad_detection_duration
  auc_roc:
    pipeline_id: vad.any.auc_roc.vad_contract_v1.vad_timebase_strict_v1.vad_auc_roc_v1
    validation: validation/vad_contract
    normalization: normalization/vad_timebase
    scoring: scoring/vad_auc_roc
input_contracts:
  vad_jsonl:
    required_roles:
      - reference_jsonl
      - sample_output
    optional_roles: []
    row_format: vad_segments_jsonl
    alignment_key: key
    aggregation: time_duration_micro_average_or_frame_auc
    purpose: voice_activity_detection
metrics:
  - f1
  - p_fa
  - p_miss
  - dcf_nist
  - auc_roc
reported_fields:
  - precision
  - recall
  - true_positive_sec
  - false_alarm_sec
  - miss_sec
  - speech_scored_sec
  - nonspeech_scored_sec
  - num_detection_samples
  - num_auc_samples
  - skipped_metrics
compatibility:
  legacy_entry: []
