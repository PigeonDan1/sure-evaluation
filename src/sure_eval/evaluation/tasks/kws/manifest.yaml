id: task/kws
version: v2
task: KWS
default_metric: macro_recall
routes:
  macro_recall:
    pipeline_id: kws.any.macro_recall.conversion_kws_sure_json_to_samples_v2.wekws_det_v2
    scoring: scoring/wekws_det
    conversion: conversion/kws_sure_json_to_samples
    aliases:
    - macro-recall
input_contracts:
  sure_json:
    required_roles:
    - reference_jsonl
    - sample_output
  wekws_score_ctc:
    required_roles:
    - wekws_label_file
    - wekws_score_file
    - keyword
  wekws_frame_score:
    required_roles:
    - wekws_label_file
    - wekws_frame_score_file
    - keyword
metrics:
- macro_recall
- per_keyword_recall
- trigger_latency
- roc_curve
- auc
compatibility:
  legacy_entry:
  - sure_eval.evaluation.tasks.kws.KWSMetricPipeline
  - scripts/run_kws_metric_pipeline.py
default_target_fa_per_hour: 0.1
