id: scoring/wekws_det
version: v2
stage: scoring
language_sensitive: false
input_schema: kws_samples
output_schema: kws_metric_report
implementation: sure_eval.evaluation.nodes.scoring.wekws_det.node
reference_compatibility:
  task_entry: sure_eval.evaluation.tasks.kws.KWSMetricPipeline
metrics:
- macro_recall
- per_keyword_recall
- trigger_latency
- roc_curve
- auc
internal_stages:
- keyword_normalization
- threshold_sweep
- fa_per_hour_operating_point
- per_keyword_recall
- trigger_latency
notes:
- Global FA/hour budget defaults to 0.1; denominator is negative recording hours.
- Macro recall is the unweighted mean of keyword recalls at the selected shared threshold.
- Latency uses the first matched trigger minus keyword end, in milliseconds.
- ROC/AUC is optional and uses false positive rate on scored clips.
- Event lists contain distinct candidates before score-threshold filtering.
